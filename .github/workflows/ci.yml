name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Syntax check (host + client)
        run: |
          node --check index.js
          node --check client.js
          node --check src/runtime.js
      - name: Unit tests
        run: node --test test/examiner.test.mjs test/plugin.mock.test.mjs
